# SPA static + /api reverse-proxy + security headers (prod)
upstream api {
  server backend:4000 max_fails=3 fail_timeout=10s;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  client_max_body_size 16m;

  # Security headers (API bhi helmet bhejta hai; yahan document-level)
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # HSTS: TLS terminator (LB) par lagao; yahan sirf jab nginx hi TLS karta ho.

  # Hashed assets: immutable cache
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API proxy (SSE-friendly timeouts)
  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 150s;
    proxy_send_timeout 150s;
    proxy_buffering off;
  }

  # SPA fallback
  location / {
    expires -1;
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
